name = "dolphin-contact-form"
main = "index.js"
account_id = "b421c569a13f32171251c80aa3c491a0"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Cloudflare cron uses UTC. This runs daily after the prior day's GA4/Ads data has had time to settle.
crons = ["30 14 * * *"]

[vars]
# Temporary compatibility vars kept so the current live config still resolves until
# Sanjay supplies the Phase 1 secret set. The Worker code now prefers secret-backed
# names and falls back to these legacy vars only to avoid breaking redeploys mid-fix.
GA4_PROPERTY_ID = "536974508"
GOOGLE_ADS_CUSTOMER_ID = "3917484159"
GOOGLE_ADS_LOGIN_CUSTOMER_ID = "6124315358"
GOOGLE_ADS_API_VERSION = "v24"
LEAD_MONITOR_DAYS = "14"
LEAD_MONITOR_END_OFFSET_DAYS = "1"
LEAD_MONITOR_UNDERCOUNT_TOLERANCE = "0.30"
LEAD_MONITOR_MIN_ABS = "2"
LEAD_MONITOR_ALERT_TO = "sales@dolphincentrifuge.com"

# ── D1 Database Binding ──────────────────────────────────────────────────────
# After running: wrangler d1 create dolphin-submissions
# Replace DATABASE_ID_HERE with the id printed by that command.
[[d1_databases]]
binding      = "DB"
database_name = "dolphin-submissions"
database_id  = "a5396fba-3578-4d7b-a802-8bcce711b77b"

# ── DEPLOYMENT INSTRUCTIONS ──────────────────────────────────────────────────
#
# STEP 1 — Create the D1 database (run once, copy the database_id it prints):
#   wrangler d1 create dolphin-submissions
#   → paste the database_id above, replacing DATABASE_ID_HERE
#
# STEP 2 — Set secrets (run each, paste value when prompted):
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_PASSWORD
#
# STEP 3 — Create the database table:
#   wrangler d1 execute dolphin-submissions --file=schema.sql --remote
#
# STEP 4 — Deploy the worker:
#   wrangler deploy
#
# ── SECRETS (set via wrangler secret put — never hardcode here) ──────────────
# RESEND_API_KEY    — from resend.com dashboard
# TURNSTILE_SECRET_KEY — from Cloudflare Turnstile dashboard (optional)
# ADMIN_PASSWORD    — your chosen password for the /admin/submissions dashboard
# GOOGLE_OAUTH_CLIENT_ID      - shared Google OAuth client id for GA4 and Ads reads
# GOOGLE_OAUTH_CLIENT_SECRET  - shared Google OAuth client secret for GA4 and Ads reads
# GA4_REFRESH_TOKEN           - GA4 analytics.readonly refresh token
# GOOGLE_ADS_REFRESH_TOKEN    - Google Ads API refresh token
# GOOGLE_ADS_DEVELOPER_TOKEN  - Google Ads developer token
# Phase 1 target secret names for the hardened live-read path:
# DC_ADMIN_TOKEN_HASH         - preferred SHA-256 hash of the dashboard bearer token
# GA4_SA_JSON                 - service-account JSON for GA4 Data API reads
# GA4_PROPERTY_ID             - GA4 property id used by the Worker
# GADS_DEVELOPER_TOKEN        - Google Ads developer token
# GADS_CLIENT_ID              - Google Ads OAuth client id
# GADS_CLIENT_SECRET          - Google Ads OAuth client secret
# GADS_REFRESH_TOKEN          - Google Ads OAuth refresh token
# GADS_LOGIN_CUSTOMER_ID      - Google Ads MCC login customer id
# GADS_CUSTOMER_ID            - Google Ads customer id
